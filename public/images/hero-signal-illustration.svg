<svg width="640" height="560" viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1f4d"/>
      <stop offset="0.55" stop-color="#123a7a"/>
      <stop offset="1" stop-color="#0a1338"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="towerMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd2ff"/>
      <stop offset="1" stop-color="#6f97e8"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7edfb"/>
    </linearGradient>
    <linearGradient id="phoneScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173a94"/>
      <stop offset="1" stop-color="#0d2364"/>
    </linearGradient>
  </defs>

  <rect width="640" height="560" fill="url(#skyBg)"/>
  <rect width="640" height="560" fill="url(#glow)"/>

  <!-- star dots -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="60" cy="70" r="1.6"/>
    <circle cx="140" cy="40" r="1.6"/>
    <circle cx="520" cy="60" r="1.6"/>
    <circle cx="580" cy="120" r="1.6"/>
    <circle cx="90" cy="150" r="1.6"/>
    <circle cx="470" cy="45" r="1.6"/>
  </g>

  <!-- tower signal arcs (concentric, radiating left) -->
  <g stroke="#7fb1ff" fill="none" stroke-linecap="round">
    <path d="M470 260 a60 60 0 0 1 0 120" stroke-width="4" opacity="0.55"/>
    <path d="M470 230 a95 95 0 0 1 0 180" stroke-width="4" opacity="0.4"/>
    <path d="M470 195 a135 135 0 0 1 0 250" stroke-width="4" opacity="0.25"/>
  </g>

  <!-- tower -->
  <g stroke="url(#towerMetal)" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="470" y1="320" x2="430" y2="470"/>
    <line x1="470" y1="320" x2="510" y2="470"/>
    <line x1="443" y1="400" x2="497" y2="400"/>
    <line x1="436" y1="435" x2="504" y2="435"/>
    <line x1="470" y1="320" x2="470" y2="180"/>
  </g>
  <circle cx="470" cy="168" r="13" fill="#ff6a2c"/>
  <circle cx="470" cy="168" r="13" fill="none" stroke="#ffb08a" stroke-width="2"/>
  <circle cx="470" cy="168" r="24" fill="none" stroke="#ff6a2c" stroke-width="2" opacity="0.5"/>

  <!-- dotted transmission path from tower to phone -->
  <path d="M452 300 C 340 340, 260 330, 205 300" stroke="#7fb1ff" stroke-width="2.5" stroke-dasharray="2 8" fill="none" opacity="0.8"/>

  <!-- city skyline silhouette -->
  <g fill="#0c1c46">
    <rect x="0" y="470" width="640" height="90"/>
  </g>
  <g fill="#132858">
    <rect x="30" y="410" width="46" height="150"/>
    <rect x="90" y="440" width="38" height="120"/>
    <rect x="540" y="430" width="42" height="130"/>
    <rect x="590" y="455" width="34" height="105"/>
  </g>
  <g fill="#ff9d5c" opacity="0.85">
    <rect x="42" y="425" width="8" height="8" rx="1.5"/>
    <rect x="58" y="445" width="8" height="8" rx="1.5"/>
    <rect x="100" y="455" width="7" height="7" rx="1.5"/>
    <rect x="554" y="450" width="7" height="7" rx="1.5"/>
  </g>

  <!-- phone mockup -->
  <g transform="translate(150,300)">
    <rect x="0" y="0" width="112" height="220" rx="22" fill="url(#phoneBody)"/>
    <rect x="8" y="10" width="96" height="200" rx="14" fill="url(#phoneScreen)"/>
    <rect x="42" y="6" width="28" height="4" rx="2" fill="#c9d6f5"/>

    <!-- signal bars on screen -->
    <g fill="#ffffff">
      <rect x="30" y="96" width="7" height="16" rx="1.5"/>
      <rect x="41" y="88" width="7" height="24" rx="1.5"/>
      <rect x="52" y="80" width="7" height="32" rx="1.5"/>
      <rect x="63" y="70" width="7" height="42" rx="1.5"/>
      <rect x="74" y="60" width="7" height="52" rx="1.5"/>
    </g>
    <text x="56" y="140" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5G</text>
    <circle cx="56" cy="168" r="15" fill="#12946f"/>
    <path d="M49 168 l5 6 l10 -12" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating badge -->
  <g transform="translate(330,120)">
    <rect x="0" y="0" width="150" height="42" rx="21" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
    <circle cx="24" cy="21" r="7" fill="#12946f"/>
    <text x="40" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Signal Boosted</text>
  </g>
</svg>
